<!DOCTYPE html>
<html lang="pt-br">

<head>
    <!--Estas tags são a base do seu site. O charset="UTF-8" garante que todos os caracteres, como acentos e emojis, sejam exibidos corretamente.-->
    <meta charset="UTF-8">
    <!--Diz ao navegador para ajustar a largura da página à largura do dispositivo, tornando seu site responsivo em celulares e tablets.-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zera's Craft | Android Ultimate</title> <!---->
    <!--A primeira é para o favicon, o pequeno ícone que aparece na aba do navegador-->
    <link rel="icon" href="icone.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css"> <!---->
    <link rel="stylesheet" href="style2.css">
    <link rel="stylesheet" href="../style.css"> <!---->
    <link rel="stylesheet" href="../style2.css">
    <!---->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!---->

    <!--é a breve descrição da sua página que pode aparecer no Google-->
    <meta name="description"
        content="Seu universo Minecraft para construir, aventurar e criar memórias inesquecíveis no Mundo Zera's Craft. Junte-se à nossa comunidade vibrante!">
    <!--são palavras-chave que ajudam a categorizar o conteúdo-->
    <meta name="keywords"
        content="Minecraft, Servidor Minecraft, Zera's Craft, comunidade, eventos, multiplayer, sobrevivência, construções, mods, jogo">
    <!--Identifica o autor do documento HTML.-->
    <meta name="author" content="Seu Nome ou Nome da Equipe Zera's Craft">
    <!--instrui o Google a "indexar" (adicionar aos resultados de busca) e "seguir" os links da sua página-->
    <meta name="robots" content="index, follow">

    <!--A URL da imagem que aparecerá como miniatura. Esta é a tag mais importante para criar uma pré-visualização visualmente atraente.-->
    <!--O título que aparece na pré-visualização.-->
    <meta property="og:title" content="Mundo Zera's Craft - Início Oficial">
    <!--A descrição que aparece na pré-visualização.-->
    <meta property="og:description"
        content="Seu universo Minecraft para construir, aventurar e criar memórias inesquecíveis no Mundo Zera's Craft. Junte-se à nossa comunidade vibrante!">
    <!--A URL da imagem que aparecerá como miniatura. Esta é a tag mais importante para criar uma pré-visualização visualmente atraente.-->
    <meta property="og:image" content="https://matheuzera.github.io/ZerasCraft/assets/images/1.site/og-image-home.jpg">
    <!--A URL da página.-->
    <meta property="og:url" content="https://seusite.com.br/index.html">

    <!--Fornecem contexto adicional sobre o tipo de conteúdo (p. ex., "website"), o nome do site e o idioma.-->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Mundo Zera's Craft">
    <meta property="og:locale" content="pt_BR">

    <!--Elas garantem que, mesmo em uma plataforma diferente, a pré-visualização do seu link seja profissional e visualmente atraente.-->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@SeuTwitterHandle">
    <meta name="twitter:creator" content="@SeuTwitterHandle">
    <meta name="twitter:title" content="Mundo Zera's Craft - O Melhor Servidor de Minecraft!">
    <meta name="twitter:description"
        content="Aventure-se em um mundo épico, construa, explore e faça amigos. Junte-se à comunidade do Zera's Craft!">
    <!---->
    <meta name="twitter:image"
        content="https://matheuzera.github.io/ZerasCraft/assets/images/1.site/twitter-card-home.jpg">
    <!--Ela define a cor da barra de endereço em navegadores de celular Android, como o Chrome-->
    <meta name="theme-color" content="#347C2F">
    <!-- Links para ScrollReveal e CountUp.js -->
    <script src="https://unpkg.com/scrollreveal"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/countup.js/2.0.7/countUp.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!--=======================================================================================================-->
    <div id="nav-placeholder-pc"></div>
    <div id="nav-placeholder-mobile"></div>
    <!--=======================================================================================================-->

    <main>
        <section class="hero">
            <div class="hero-bg" style="background-image: url('../assets/images/geral/banner-fundo.gif');"></div>

            <div class="hero-content">
                <span class="hero-tag">Mundo Zera's Craft</span>

                <h1 class="hero-title">ANDROID ULTIMATE</h1>

                <p class="hero-desc">Android.</p>

                <div class="hero-actions">
                    <a href="#" class="btn-hero-green">DISCORD <i class="fas fa-chevron-right"></i></a>
                    <a href="#" class="btn-hero-outline">CANAL OFICIAL</a>
                </div>
            </div>
        </section>

        <div class="section-header section-games">
            <h2>ANDROID APPs</h2>
        </div>

        <section class="section-software">
            <div class="software-grid">

                <div class="software-card">
                    <div class="card-header">
                        <div class="card-icon">
                            <img src="img.png">
                        </div>
                        <div class="tag-adobe">Ferramenta</div>
                    </div>
                    <div class="card-info">
                        <div class="card-text">
                            <h3>AppName</h3>
                            <p>Text.</p>
                        </div>
                        <div class="card-footer">
                            <a href="LINK" class="dl-link">
                                <i class="fab fa-android"></i> Download
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="stats-section">
            <div class="container stats-flex reveal">
                <div class="stat-item">
                    <span><strong class="counter stat-total" id="stat-total">0</strong></span>
                    <span>MEMBROS TOTAIS</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-item">
                    <span><strong class="counter stat-online" id="stat-total">0</strong></span>
                    <span>MEMBROS ONLINE</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-item">
                    <strong>02/07/2025</strong>
                    <span>CRIADO EM</span>
                </div>
            </div>
        </section>
    </main>

    <!--------------------------------------------------------------->

    <!-- Placeholders do Player e Rodapé (caso sejam carregados via JS) -->
    <div id="player-container"></div>
    <div id="footer-placeholder"></div>

    <script src="../script.js"></script>
    <script src="../script2.js"></script>
    <script src="../load-html.js"></script>
    <script src="../effects.js"></script>
    <script src="../player.js"></script>
</body>

</html>
