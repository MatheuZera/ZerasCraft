<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zera's Craft - Estado Real do Servidor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: monospace;
      background-color: #121214;
      background-image: linear-gradient(rgba(18, 18, 20, 0.9), rgba(18, 18, 20, 0.9)), url('../assets/images/geral/banner-fundo.gif');
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: #fff;
    }

    /* Container Bedrock GUI */
    .status-card {
      background-color: #c6c6c6;
      border: 4px solid #373737;
      box-shadow: inset 4px 4px #ffffff, inset -4px -4px #555555, 0 20px 40px rgba(0,0,0,0.8);
      width: 540px;
      max-width: 95vw;
      padding: 20px;
      color: #3f3f3f;
      image-rendering: pixelated;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card-header {
      font-size: 15px;
      font-weight: bold;
      border-bottom: 2px solid #373737;
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Bloco do Monitor de Estado */
    .monitor-box {
      background-color: #111;
      border: 3px solid #373737;
      box-shadow: inset 3px 3px #000;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .data-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      border-bottom: 1px dashed #333;
      padding-bottom: 6px;
    }

    .data-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .label { color: #f8cb47; font-weight: bold; }
    .val-active { color: #55bd34; font-weight: bold; }
    .val-offline { color: #ff4444; font-weight: bold; }
    .val-text { color: #fff; font-weight: bold; }

    /* Botões Bedrock */
    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .pixel-btn {
      background-color: #555;
      color: #fff;
      border: 2px solid #222;
      box-shadow: inset 2px 2px #888, inset -2px -2px #333;
      padding: 10px;
      font-family: monospace;
      font-weight: bold;
      cursor: pointer;
      font-size: 11px;
      text-align: center;
    }
    .pixel-btn:hover { background-color: #666; }
    .pixel-btn:active { box-shadow: inset 2px 2px #333, inset -2px -2px #888; }
  </style>
</head>
<body>

  <div class="status-card">
    <div class="card-header">
      <span>Painel de Conexão Real</span>
      <span style="font-size: 10px; color: #555;">[MCPixelLegends]</span>
    </div>

    <div class="monitor-box">
      <div class="data-row">
        <span class="label">☕ IP Java (PC):</span>
        <span class="val-text">MCPixelLegends.aternos.me</span>
      </div>
      <div class="data-row">
        <span class="label">🔌 Porta Java:</span>
        <span class="val-text">25565 (Padrão)</span>
      </div>
      <div class="data-row">
        <span class="label">📱 IP Bedrock (PE/Win10):</span>
        <span class="val-text">MCPixelLegends.aternos.me</span>
      </div>
      <div class="data-row">
        <span class="label">🔌 Porta Bedrock:</span>
        <span class="val-text" id="bedrockPortVal">Verificando no Aternos...</span>
      </div>
      <div class="data-row">
        <span class="label">🔴 Estado do Servidor:</span>
        <span id="serverStatusVal" class="val-offline">A verificar servidor...</span>
      </div>
    </div>

    <div class="actions-grid">
      <button class="pixel-btn" onclick="copyText('MCPixelLegends.aternos.me')">📋 Copiar IP</button>
      <button class="pixel-btn" onclick="checkServerState()">🔄 Atualizar Agora</button>
    </div>
  </div>

  <script>
    const SERVER_DOMAIN = 'MCPixelLegends.aternos.me';

    async function checkServerState() {
      const statusEl = document.getElementById('serverStatusVal');
      const portEl = document.getElementById('bedrockPortVal');

      statusEl.className = 'val-text';
      statusEl.textContent = '🔄 A consultar Aternos...';

      try {
        // Consulta sem cache para verificar se o Aternos está realmente ligado
        const res = await fetch(`https://api.mcsrvstat.us/3/${SERVER_DOMAIN}?timestamp=${Date.now()}`);
        const data = await res.json();

        // O Aternos só é considerado ONLINE se a flag for verdadeira e existirem dados de protocolo/jogadores
        if (data.online === true && data.protocol) {
          statusEl.className = 'val-active';
          statusEl.textContent = `🟢 ONLINE (${data.players?.online || 0}/${data.players?.max || 20} Jogadores)`;
          
          // Exibe a porta real atribuída
          portEl.textContent = data.port || '19132';
        } else {
          throw new Error('Server Offline');
        }
      } catch (err) {
        statusEl.className = 'val-offline';
        statusEl.textContent = '🔴 OFFLINE (Ligue o servidor no painel do Aternos)';
        portEl.textContent = 'Servidor Desligado';
      }
    }

    function copyText(txt) {
      navigator.clipboard.writeText(txt);
      alert('IP copiado: ' + txt);
    }

    // Executa a verificação ao carregar a página
    checkServerState();
  </script>

</body>
</html>
