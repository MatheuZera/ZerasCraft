        /* --- BARRA SUPERIOR (ESTILO BEDROCK) --- */

            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 24px 30px;
            z-index: 100;

        }

        .bedrock-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #272733;
            border: 2px solid #1a1a24;
            border-top: 2px solid #4a4a5e;
            border-left: 2px solid #4a4a5e;
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            transition: transform 0.1s;
            text-decoration: none;
            height: 40px;
        }

        .bedrock-btn:hover {
            filter: brightness(1.15);
        }

        .bedrock-btn:active {
            transform: translateY(2px);
        }

        .btn-icon-box {
            width: 36px;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            flex-shrink: 0;
        }

        .help-icon {
            background: #6366f1;
        }

        .login-icon {
            background: #10b981;
        }

        .btn-text {
            padding: 0 14px;
            font-size: 0.75rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .minecraft-scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- TELA DE FLASHBANG DA EXPLOSÃO --- */
        .flash-bang {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #fff;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            animation: flash var(--timing) ease-out infinite;
        }

        @keyframes flash {

            0%,
            70.9% {
                opacity: 0;
            }

            71% {
                opacity: 1;
            }

            76%,
            100% {
                opacity: 0;
            }
        }

        /* --- CREEPER ACTOR --- */
        .creeper-actor {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 64px;
            height: 128px;
            z-index: 10;
            transform: translate(-50%, -50%);
            animation: master-timeline var(--timing) cubic-bezier(0.25, 1, 0.5, 1) infinite;
        }

        .creeper-body-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: screen-shake var(--timing) linear infinite;
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.6));
        }

        .c-head {
            width: 64px;
            height: 64px;
            background: var(--c-green);
            position: relative;
            z-index: 5;
            animation: head-turn var(--timing) steps(1) infinite;
        }

        @keyframes head-turn {

            0%,
            33% {
                transform: rotate(0deg);
            }

            34% {
                transform: rotate(-10deg);
            }

            37% {
                transform: rotate(10deg);
            }

            40%,
            100% {
                transform: rotate(0deg);
            }
        }

        .c-body {
            width: 32px;
            height: 48px;
            background: var(--c-body);
            position: relative;
        }

        .c-legs {
            display: flex;
            justify-content: center;
            width: 64px;
        }

        .c-leg {
            width: 16px;
            height: 16px;
            background: var(--c-leg);
            margin: 0 1px;
            position: relative;
        }

        /* --- PISCAR CONSTANTE (SIZZLE) --- */
        .sizzle-overlay,
        .c-body::after,
        .c-leg::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            opacity: 0;
            animation: sizzle-logic var(--timing) linear infinite;
        }

        @keyframes sizzle-logic {

            0%,
            48% {
                opacity: 0;
            }

            49%,
            51%,
            53%,
            55%,
            57%,
            59%,
            61%,
            63%,
            65%,
            67%,
            69% {
                opacity: 0.8;
            }

            50%,
            52%,
            54%,
            56%,
            58%,
            60%,
            62%,
            64%,
            66%,
            68%,
            70% {

            }

            70.5% {
                opacity: 1;
            }

            71%,
            100% {
                opacity: 0;
            }
        }

        /* --- TIMELINE MESTRA COM ESQUIVAS E INCLINAÇÕES DINÂMICAS --- */
        @keyframes master-timeline {
            0% {
                transform: translate(calc(-50% - 65vw), -50%) scale(1) rotate(0deg);
                opacity: 0;
                filter: brightness(1);
            }

            5% {
                opacity: 1;
            }

            /* Chega no meio exato da tela e para */
            33% {
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
            }

            /* Se espanta usando scale e leve balanço de surpresa */
            36% {
                transform: translate(-50%, -50%) scale(1.15, 0.85) rotate(-3deg);
            }

            39% {
                transform: translate(-50%, -50%) scale(0.95, 1.05) rotate(3deg);
            }

            42% {
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
            }

            /* Avanço com esquivas laterais combinadas a inclinações corporais expressivas */
            45% {
                transform: translate(calc(-50% - 35px), -50%) scale(1.05) rotate(-7deg);
                filter: brightness(1.05);
            }

            48% {
                transform: translate(calc(-50% + 40px), -50%) scale(1.1) rotate(7deg);
                filter: brightness(1.1);
            }

            51% {
                transform: translate(calc(-50% - 30px), -50%) scale(1.25) rotate(-9deg);
                filter: brightness(1.2);
            }

            54% {
                transform: translate(calc(-50% + 35px), -50%) scale(1.5) rotate(9deg);
                filter: brightness(1.3);
            }

            57% {
                transform: translate(calc(-50% - 20px), -50%) scale(1.8) rotate(-5deg);
                filter: brightness(1.4);
            }

            60% {
                transform: translate(calc(-50% + 25px), -50%) scale(2.1) rotate(5deg);
                filter: brightness(1.6);
            }

            63% {
                transform: translate(calc(-50% - 10px), -50%) scale(2.5) rotate(-3deg);
                filter: brightness(1.9);
            }

            66% {
                transform: translate(calc(-50% + 10px), -50%) scale(2.9) rotate(3deg);
                filter: brightness(2.2);
            }

            70.8% {
                transform: translate(-50%, -50%) scale(3.8) rotate(0deg);
                filter: brightness(10);
                opacity: 1;
            }

            /* Detonação */
            71% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(4.5) rotate(0deg);
            }

            100% {
                opacity: 0;
            }
        }

        /* --- ROSTO DO CREEPER --- */
        .c-face-pixel {
            position: absolute;
            width: 8px;
            height: 8px;
            box-shadow:
                8px 16px #000, 16px 16px #000, 8px 24px #000, 16px 24px #000,
                40px 16px #000, 48px 16px #000, 40px 24px #000, 48px 24px #000,
                24px 32px #000, 32px 32px #000, 16px 40px #000, 24px 40px #000,
                32px 40px #000, 40px 40px #000, 16px 48px #000, 24px 48px #000,
                32px 48px #000, 40px 48px #000, 16px 56px #000, 40px 56px #000;
            animation: face-visibility var(--timing) steps(1) infinite;
        }

        @keyframes face-visibility {

            0%,
            32.9% {
                opacity: 0;
            }

            33%,
            70.9% {
                opacity: 1;
            }

            71%,
            100% {
                opacity: 0;
            }
        }

        @keyframes screen-shake {

            0%,
            47% {
                transform: translate(0, 0);
            }

            48%,
            52%,
            56%,
            60%,
            64%,
            68% {
                transform: translate(4px, -3px);
            }

            50%,
            54%,
            58%,
            62%,
            66% {
                transform: translate(-4px, 4px);
            }

            70.5% {
                transform: translate(8px, -8px);
            }

            71%,
            100% {
                transform: translate(0, 0);
            }
        }

        /* --- ONDA DE CHOQUE E DETRITOS --- */
        .particle-burst-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 40;
        }

        .shockwave {
            position: absolute;
            width: 10px;
            height: 10px;
            border: 15px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            animation: shock var(--timing) cubic-bezier(0.1, 0.8, 0.2, 1) infinite;
        }

        @keyframes shock {

            0%,
            70.9% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0);
            }

            71% {
                opacity: 1;
                border-width: 15px;
                transform: translate(-50%, -50%) scale(1);
            }

            75% {
                opacity: 0;
                border-width: 0px;
                transform: translate(-50%, -50%) scale(80);
            }

            100% {
                opacity: 0;
            }
        }

        .p-part {
            position: absolute;
            width: 18px;
            height: 18px;
            opacity: 0;
            border-radius: 2px;
            animation: burst var(--timing) cubic-bezier(0.1, 0.8, 0.2, 1) infinite;
        }

        .c-white {
            background: #fff;
            box-shadow: 0 0 14px #fff;
        }

        .c-green-part {
            background: #4ade80;
            box-shadow: 0 0 14px #22c55e;
        }

        .c-dark {
            background: #27272a;
            box-shadow: 0 0 14px #18181b;
        }

        @keyframes burst {

            0%,
            70.9% {
                opacity: 0;
                transform: translate(0, 0) scale(0.5) rotate(0deg);
            }

            71% {
                opacity: 1;
                transform: translate(0, 0) scale(1.5) rotate(0deg);
            }

            90%,
            100% {
                opacity: 0;
                transform: translate(var(--x), var(--y)) scale(0) rotate(540deg);
            }
        }

        /* --- 404 GLITCH --- */
        .error-display {
            position: absolute;
            text-align: center;
            animation: err-reveal var(--timing) linear infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 60;
        }

        @keyframes err-reveal {

            0%,
            70.9% {
                opacity: 0;
                visibility: hidden;
                transform: scale(0.9);
            }

            71%,
            95% {
                opacity: 1;
                visibility: visible;
                transform: scale(1);
            }

            98%,
            100% {
                opacity: 0;
                visibility: hidden;
                transform: scale(1.05);
            }
        }

        .glitch {
            font-size: 8.5rem;
            font-weight: 900;
            color: #fff;
            position: relative;
            letter-spacing: 4px;
            animation: glitch-skew 1s infinite linear alternate-reverse;
        }

        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .glitch::before {
            left: 3px;
            text-shadow: -3px 0 #ff0055;
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim 3s infinite linear alternate-reverse;
        }

        .glitch::after {
            left: -3px;
            text-shadow: -3px 0 #00ffff, 0 3px #ff0055;
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim2 2.5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% {
                clip: rect(15px, 999px, 40px, 0);
                transform: skew(0.3deg);
            }

            20% {
                clip: rect(65px, 999px, 98px, 0);
                transform: skew(0.8deg);
            }

            40% {
                clip: rect(10px, 999px, 55px, 0);
                transform: skew(0.1deg);
            }

            60% {
                clip: rect(80px, 999px, 120px, 0);
                transform: skew(0.5deg);
            }

            80% {
                clip: rect(30px, 999px, 75px, 0);
                transform: skew(0.2deg);
            }

            100% {
                clip: rect(50px, 999px, 100px, 0);
                transform: skew(0.6deg);
            }
        }

        @keyframes glitch-anim2 {
            0% {
                clip: rect(70px, 999px, 110px, 0);
                transform: skew(0.5deg);
            }

            5% {
                clip: rect(20px, 999px, 60px, 0);
                transform: skew(0.2deg);
            }

            50% {
                clip: rect(95px, 999px, 130px, 0);
                transform: skew(0.9deg);
            }

            75% {
                clip: rect(5px, 999px, 45px, 0);
                transform: skew(0.1deg);
            }

            100% {
                clip: rect(40px, 999px, 85px, 0);
                transform: skew(0.4deg);
            }
        }

        /* --- MODAL DE AJUDA --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-container {
            width: 520px;
            max-width: 90vw;
            background: #18181b;
            border: 1px solid #3f3f46;
            border-radius: 6px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform: scale(0.9) translateY(15px);
            opacity: 0;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .modal-overlay.active .modal-container {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .modal-header {
            padding: 16px 20px;
            background: #18181b;
            border-bottom: 1px solid #3f3f46;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1rem;
            font-weight: 800;
            color: #fde047;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            line-height: 1;
            margin: 0;
            letter-spacing: -0.2px;
        }

        .modal-close {
            background: transparent;
            border: 1px solid #52525b;
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.15s ease;
        }

        .modal-close:hover {
            background: #3f3f46;
            border-color: #71717a;
        }

        .modal-body {
            padding: 20px;
            font-size: 0.9rem;
            color: #e4e4e7;
            line-height: 1.6;
            max-height: 350px;
            overflow-y: auto;
        }

        .modal-body ul {
            padding-left: 20px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        @media (max-width: 480px) {
            .btn-text {
                display: none;
            }

            .bedrock-btn {
                width: 40px;
            }

            .top-header {
                padding: 16px;
            }

            .glitch {
                font-size: 6rem;
            }

            .error-subtext {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>

    <div class="top-header">
        <a href="#" class="bedrock-btn" onclick="openModal('help'); return false;">
            <div class="btn-icon-box help-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
            </div>
            <span class="btn-text">HELP</span>
        </a>

        <a href="#" class="bedrock-btn" onclick="openModal('options'); return false;">
            <div class="btn-icon-box login-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
                    <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
                    <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                    <line x1="12" y1="20" x2="12.01" y2="20"></line>
                </svg>
            </div>
            <span class="btn-text">SEU Wi-Fi</span>
        </a>
    </div>

    <!-- Tela do Flash (Cegueira) -->
    <div class="flash-bang"></div>

    <main>
        <section class="minecraft-scene">
            <!-- Creeper Animado -->
            <div class="creeper-actor">
                <div class="creeper-body-wrapper">
                    <div class="c-head">
                        <div class="c-face-pixel"></div>
                        <div class="sizzle-overlay"></div>
                    </div>
                    <div class="c-body"></div>
                    <div class="c-legs">
                        <div class="c-leg l-front"></div>
                        <div class="c-leg r-front"></div>
                        <div class="c-leg l-back"></div>
                        <div class="c-leg r-back"></div>
                    </div>
                </div>
            </div>

            <!-- Partículas de Explosão e Onda de Choque -->
            <div class="particle-burst-container">
                <div class="shockwave"></div>

                <!-- Detritos Brancos -->
                <div class="p-part c-white" style="--x: -450px; --y: -350px;"></div>
                <div class="p-part c-white" style="--x: 450px; --y: -350px;"></div>
                <div class="p-part c-white" style="--x: 0px; --y: -650px;"></div>
                <div class="p-part c-white" style="--x: -650px; --y: 0px;"></div>
                <div class="p-part c-white" style="--x: 650px; --y: 0px;"></div>
                <div class="p-part c-white" style="--x: 0px; --y: 650px;"></div>
                <div class="p-part c-white" style="--x: -450px; --y: 350px;"></div>
                <div class="p-part c-white" style="--x: 450px; --y: 350px;"></div>

                <!-- Detritos Verdes -->
                <div class="p-part c-green-part" style="--x: -300px; --y: -200px;"></div>
                <div class="p-part c-green-part" style="--x: 300px; --y: -200px;"></div>
                <div class="p-part c-green-part" style="--x: 0px; --y: -400px;"></div>
                <div class="p-part c-green-part" style="--x: -400px; --y: 0px;"></div>
                <div class="p-part c-green-part" style="--x: 400px; --y: 0px;"></div>
                <div class="p-part c-green-part" style="--x: 0px; --y: 400px;"></div>
                <div class="p-part c-green-part" style="--x: -300px; --y: 200px;"></div>
                <div class="p-part c-green-part" style="--x: 300px; --y: 200px;"></div>

                <!-- Detritos Escuros (Fumaça) -->
                <div class="p-part c-dark" style="--x: -150px; --y: -500px;"></div>
                <div class="p-part c-dark" style="--x: 150px; --y: -500px;"></div>
                <div class="p-part c-dark" style="--x: -500px; --y: -150px;"></div>
                <div class="p-part c-dark" style="--x: 500px; --y: -150px;"></div>
                <div class="p-part c-dark" style="--x: -500px; --y: 150px;"></div>
                <div class="p-part c-dark" style="--x: 500px; --y: 150px;"></div>
                <div class="p-part c-dark" style="--x: -150px; --y: 500px;"></div>
                <div class="p-part c-dark" style="--x: 150px; --y: 500px;"></div>
            </div>

            <!-- Título Erro 404 Estilizado -->
            <div class="error-display">
                <h1 class="glitch" data-text="404">404</h1>
                <span class="error-subtext">PÁGINA NÃO ENCONTRADA!</span>
                <a href="https://matheuzera.github.io/ZerasCraft/" class="back-home-btn">VOLTAR AO INÍCIO</a>
            </div>
        </section>
    </main>

    <!-- MODAL INTERATIVO -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModalBg(event)">
        <div class="modal-container">
            <div class="modal-header">
                <div class="modal-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="16" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12.01" y2="8"></line>
                    </svg>
                    <span id="modalTitleText">Título da Solução</span>
                </div>
                <button class="modal-close" onclick="closeModal()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script>
        const modalContent = {
            'help': {
                title: 'Página Não Encontrada',
                steps: [
                    'O link que você tentou acessar está quebrado ou a página foi movida.',
                    'Verifique se a URL digitada no navegador está correta.',
                    'Aguarde a animação terminar e clique no botão para voltar ao Início do site.'
                ]
            },
            'options': {
                title: 'Status do seu Wi-Fi e Rede Local',
                steps: [
                    'Verifique o estado atual da sua conexão Wi-Fi ou cabo de rede.',
                    'Caso sua internet esteja instável, reiniciar o roteador pode ajudar a limpar a rota de conexão.',
                    'Se o erro persistir em várias páginas, verifique o status do provedor.'
                ]
            }
        };

        function openModal(id) {
            const data = modalContent[id];
            if (!data) return;

            document.getElementById('modalTitleText').innerText = data.title;

            let html = '<strong>Instruções recomendadas:</strong><ul>';
            data.steps.forEach(step => {
                html += `<li>${step}</li>`;
            });
            html += '</ul>';

            document.getElementById('modalBody').innerHTML = html;
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function closeModalBg(event) {
            if (event.target.id === 'modalOverlay') {
                closeModal();
            }
        }
    </script>
</body>

</html>
