<div class="minecraft-jukebox-wrapper">
  <audio id="backgroundAudio" preload="auto"></audio>

  <!-- Central Message com Status, Título e Tempo Alinhados Verticalmente -->
  <div id="centralMessage" class="central-message">
    <div id="msgIconWrapper" class="msg-icon-mini">
      <i id="msgIconType" class="fas fa-music"></i>
    </div>
    <div class="msg-text-group">
      <div class="msg-header">
        <span id="messageStatus" class="msg-status">Tocando</span>
        <span id="messageTitle" class="msg-title">Carregando...</span>
      </div>
      <div class="msg-duration-wrapper">
        <span id="messageDuration" class="msg-duration">00m:00s / 00m:00s</span>
      </div>
    </div>
  </div>

  <!-- Container de Partículas e Jukebox -->
  <div class="jukebox-item-container">
    <div id="notesContainer" class="notes-container"></div>
    <div id="jukeboxTrigger" class="jukebox-block" title="1x: Play/Pause | 2x: Próxima | >3x: Abrir Lista | Segurar: Modo">
      <img src="assets/images/geral/jukebox.webp" alt="Jukebox" class="jukebox-img">
    </div>
  </div>

  <!-- Modal de Playlist Completa -->
  <div id="jukeboxPlaylistModal" class="jukebox-playlist-modal">
    <div class="jukebox-modal-content">
      <div class="jukebox-modal-header">
        <h3><i class="fas fa-compact-disc"></i> Playlist do Jukebox</h3>
        <button id="closePlaylistModal" class="jukebox-close-btn">&times;</button>
      </div>
      <div id="jukeboxPlaylistCategories" class="jukebox-categories-container">
        <!-- Categorias preenchidas dinamicamente via JS -->
      </div>
    </div>
  </div>
</div>
