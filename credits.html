    <!-- ESTILOS DO SLIDER, BOTÃO E RESPONSIVIDADE MOBILE -->
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* OVERLAY INICIAL TOTALMENTE PRETO */
        .start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .start-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .btn-start {
            background: #01a709;
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: 800;
            padding: 16px 36px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: transform 0.2s ease, background 0.3s ease, box-shadow 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 0 15px rgba(1, 167, 9, 0.4);
        }

        .btn-start:hover,
        .btn-start:active {
            transform: scale(1.05);
            background: #06ec11;
            box-shadow: 0 0 25px rgba(6, 236, 17, 0.7);
        }

        /* BANNER E HERO */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: #000000;
        }

        .hero-bg-slider {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .hero-bg-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        .hero-bg-slide.active {
            opacity: 1;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            z-index: 2;
        }

        .hero-content {
            position: relative;
            z-index: 3;
            text-align: center;
            max-width: 900px;
            padding: 0 20px;
        }

        .hero-tag {
            display: inline-block;
            background-color: #ffce6c;
            color: #000;
            font-weight: 800;
            padding: 6px 16px;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        .hero-desc {
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: 600;
            line-height: 1.6;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            min-height: 80px;
            transition: opacity 0.8s ease-in-out;
            opacity: 1;
        }

        .hero-desc.fade-out {
            opacity: 0;
        }

        /* MEDIA QUERIES PARA MOBILE */
        @media (max-width: 768px) {
            .hero-tag {
                font-size: 0.78rem;
                padding: 5px 12px;
                margin-bottom: 18px;
            }

            .hero-desc {
                font-size: 1.15rem;
                line-height: 1.5;
                min-height: 90px;
            }

            .btn-start {
                font-size: 1rem;
                padding: 14px 28px;
                letter-spacing: 1px;
            }
        }

        @media (max-width: 480px) {
            .hero-content {
                padding: 0 16px;
            }

            .hero-desc {
                font-size: 1rem;
                min-height: 100px;
            }
        }
    </style>

                this.slidesData.forEach((slide) => {
                    const slideDiv = document.createElement('div');
                    slideDiv.className = 'hero-bg-slide';
                    slideDiv.style.backgroundImage = `url('${slide.url}')`;
                    container.appendChild(slideDiv);
                });
            },

            start() {
                const container = document.getElementById('heroBgSlider');
                const textElement = document.getElementById('heroDesc');
                if (!container || !textElement) return;

                const slides = container.querySelectorAll('.hero-bg-slide');
                if (slides.length > 0) {
                    slides[0].classList.add('active');
                    textElement.textContent = this.slidesData[0].text;
                }

                if (this.slidesData.length > 1 && !this.timer) {
                    this.timer = setInterval(() => this.nextSlide(container, textElement), this.intervalSeconds * 1000);
                }
            },

            nextSlide(container, textElement) {
                const slides = container.querySelectorAll('.hero-bg-slide');

                slides[this.currentIndex].classList.remove('active');
                this.currentIndex = (this.currentIndex + 1) % slides.length;
                slides[this.currentIndex].classList.add('active');

                textElement.classList.add('fade-out');
                setTimeout(() => {
                    textElement.textContent = this.slidesData[this.currentIndex].text;
                    textElement.classList.remove('fade-out');
                }, 800);
            }
        };

    <!-- MOTOR DE ÁUDIO E CONTROLE DE INÍCIO COM TIMESTAMP DE 3:30 E LOOP -->
    <script>
        const ZerasAudio = {
            audioId: 'backgroundAudio',
            playlist: [
                'assets/audios/musics/background/Credits.mp3',
            ],
            currentIndex: 0,
            startTimeSeconds: 240, // 3 minutos e 30 segundos (3 * 60 + 30)

            init() {
                let audio = document.getElementById(this.audioId);
                if (!audio) {
                    audio = document.createElement('audio');
                    audio.id = this.audioId;
                    audio.preload = 'auto';
                    document.body.appendChild(audio);
                }

                const savedVolume = localStorage.getItem('audioBackgroundVolume');
                audio.volume = savedVolume !== null ? parseFloat(savedVolume) : 0.5;

                // Quando a música terminar, reinicia a partir de 3:30 e reproduz novamente em loop
                audio.addEventListener('ended', () => {
                    audio.currentTime = this.startTimeSeconds;
                    audio.play().catch(err => console.warn("[Áudio] Erro ao reiniciar áudio em loop:", err));
                });

                const startBtn = document.getElementById('startBtn');
                const startOverlay = document.getElementById('startOverlay');

                if (startBtn && startOverlay) {
                    startBtn.addEventListener('click', () => {
                        // Toca a música iniciando em 3:30
                        this.playCurrentTrack(audio);

                        // Dispara o slider de imagens
                        NostalgicSlider.start();

                        // Oculta a tela preta com fade-out
                        startOverlay.classList.add('hidden');
                    });
                }
            },

            playCurrentTrack(audio) {
                if (!this.playlist[this.currentIndex]) return;

                audio.src = this.playlist[this.currentIndex];

                // Ajusta o tempo de início assim que os metadados do áudio forem carregados
                const setStartTime = () => {
                    audio.currentTime = this.startTimeSeconds;
                };

                audio.addEventListener('loadedmetadata', setStartTime, { once: true });

                audio.play().then(() => {
                    audio.currentTime = this.startTimeSeconds;
                }).catch(err => {
                    console.warn("[Áudio] Reprodução bloqueada pelo navegador.");
                });
            }
        };

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => ZerasAudio.init());
        } else {
            ZerasAudio.init();
        }
    </script>
